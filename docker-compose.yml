version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: polaris_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: polaris123  # <--- SIMPLIFIED PASSWORD
      POSTGRES_DB: polaris_lms
    ports:
      - "5433:5432"
    volumes:
      - polaris_data_v3:/var/lib/postgresql/data # <--- BRAND NEW VOLUME NAME

  pgadmin:
    image: dpage/pgadmin4
    container_name: polaris_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@polaris.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  polaris_data_v3: # <--- MATCHES ABOVE